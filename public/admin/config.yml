backend:
  name: github
  repo: milito-10/angel-portafolio
  branch: main
  base_url: https://api.netlify.com
  site_domain: portafolio-de-contenidos.netlify.app
locale: es
media_folder: src/content/works/images
public_folder: ./images

collections:
  - name: trabajos
    label: Trabajos
    label_singular: Trabajo
    description: Crea, edita y organiza los proyectos del portafolio.
    delete: true
    folder: src/content/works
    path: "{{slug}}"
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    media_folder: images
    public_folder: ./images
    fields:
      - { label: Título, name: title, widget: string, hint: Nombre que aparecerá en el portafolio. }
      - label: Categoría
        name: category
        widget: select
        options:
          - { label: Fotografía, value: fotografia }
          - { label: Retratos, value: retratos }
          - { label: Videoclips, value: videoclips }
          - { label: Eventos, value: eventos }
          - { label: Diseño gráfico, value: diseno-grafico }
      - label: Tipo
        name: type
        widget: select
        options:
          - { label: Fotografía, value: foto }
          - { label: Video, value: video }
      - label: Imagen
        name: image
        widget: image
        allow_multiple: false
        choose_url: false
        hint: Sube una imagen JPG, PNG o WebP desde tu computador. Se guarda en src/content/works/images.
      - { label: Enlace del video (YouTube o Vimeo), name: videoUrl, widget: string, required: false, hint: Pega el enlace público del video; no subas archivos de video. }
      - { label: Descripción, name: description, widget: text }
      - { label: Cliente, name: client, widget: string, required: false }
      - { label: Fecha, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: Publicado, name: published, widget: boolean, default: true }
      - { label: Trabajo de ejemplo, name: sample, widget: boolean, default: false, hint: Actívalo solo para proyectos provisionales que deben identificarse como muestra. }

  - name: orden-galeria
    label: Orden de la galería
    description: Arrastra los trabajos publicados para cambiar el orden de la galería.
    delete: false
    files:
      - name: galeria
        label: Orden de la galería
        file: src/content/data/gallery-order.json
        media_folder: src/content/data/images
        public_folder: ./images
        fields:
          - label: Trabajos en el orden de la galería
            name: items
            widget: list
            hint: Los trabajos publicados que no estén en esta lista aparecerán al final.
            field:
              label: Trabajo
              name: work
              widget: relation
              collection: trabajos
              search_fields: [title]
              value_field: "{{slug}}"
              display_fields: [title]

  - name: destacados
    label: Destacados
    description: Elige y ordena los trabajos que aparecen en Inicio.
    delete: false
    files:
      - name: destacados
        label: Trabajos destacados
        file: src/content/data/featured.json
        media_folder: src/content/data/images
        public_folder: ./images
        fields:
          - label: Trabajos destacados
            name: items
            widget: list
            hint: El primer trabajo también se usa como imagen principal.
            field:
              label: Trabajo
              name: work
              widget: relation
              collection: trabajos
              search_fields: [title]
              value_field: "{{slug}}"
              display_fields: [title]

  - name: marcas
    label: Marcas
    description: Logos de marcas para mostrar en la página de Inicio.
    delete: false
    files:
      - name: marcas
        label: Marcas con las que he trabajado
        file: src/content/data/brands.json
        media_folder: src/content/data/images
        public_folder: ./images
        fields:
          - label: Marcas (arrastrar para ordenar)
            name: items
            widget: list
            fields:
              - { label: Nombre, name: name, widget: string }
              - label: Logo
                name: logo
                widget: image
                allow_multiple: false
                choose_url: false
                hint: Sube el archivo desde tu computador.
              - { label: Enlace público, name: link, widget: string, required: false }

  - name: ajustes
    label: Ajustes
    description: Textos de Inicio, biografía y datos de contacto.
    delete: false
    files:
      - name: sitio
        label: Textos y datos de contacto
        file: src/content/data/site-settings.json
        media_folder: src/content/data/images
        public_folder: ./images
        fields:
          - { label: WhatsApp (código de país y número), name: whatsappNumber, widget: string, hint: Escribe solo números, incluido el código de país; por ejemplo, 573001234567. }
          - { label: Enlace de Instagram, name: instagramUrl, widget: string, hint: Usa el enlace completo que comienza con https://. }
          - { label: Título principal, name: heroTitle, widget: string }
          - { label: Subtítulo principal, name: heroSubtitle, widget: text }
          - { label: Biografía, name: bio, widget: text }
          - label: Retrato
            name: portrait
            widget: image
            allow_multiple: false
            choose_url: false
            hint: Sube una fotografía desde tu computador.
